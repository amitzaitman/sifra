<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>סִפְרָה</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="preload" href="../fonts/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../app.css">
</head>
<body>
  <!-- index.html with the fixture games of tests/fixtures instead of the registry; ?seed=n fixes the seeds. The story
       fixture comes only with ?story: its skill would move the next step that the other specs expect. -->
  <div id="app"></div>
  <script type="module">
    import { start } from '../app.js';
    import * as parts from '../tests/fixtures/parts/game.js';
    import * as scale from '../tests/fixtures/scale/game.js';
    import * as story from '../tests/fixtures/story/game.js';
    const params = new URLSearchParams(location.search);
    const seed = Number(params.get('seed')) || undefined;
    start({ root: document.getElementById('app'), games: [parts, scale, ...(params.has('story') ? [story] : [])], seed });
  </script>
</body>
</html>
